[project]
name = "womap"
version = "0.1.0"
description = "通用地图数据查看与图斑轻量编辑工具后端服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "geoalchemy2>=0.18.0",
    "geopandas>=1.1.0",
    "keyring>=25.6.0",
    "pydantic-settings>=2.10.0",
    "pyogrio>=0.11.0",
    "pyproj>=3.7.0",
    "pyyaml>=6.0.0",
    "redis>=6.2.0",
    "smbprotocol>=1.15.0",
    "shapely>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
