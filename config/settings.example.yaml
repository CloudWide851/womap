app:
  name: WOMAP
  version: 0.1.0
  environment: local
  debug: true

server:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

frontend:
  dev_server:
    host: 127.0.0.1
    port: 5173

runtime:
  # Gate 1 仅报告运行模式；production 模式将在后续独立交付中接入启动器。
  mode: development

imports:
  cache_path: .womap-data/import-cache
  batch_size: 2000
  raster_store_path: .womap-data/rasters
  raster_scratch_path: .womap-data/raster-scratch
  raster_quota_gb: 200
  sources: []

database:
  driver: postgresql+asyncpg
  host: 127.0.0.1
  port: 5432
  name: womap
  username: womap
  password: "replace-with-local-password"
  ssl: false
  pool:
    min_size: 2
    max_size: 10
    timeout_seconds: 30

test_database:
  driver: sqlite+aiosqlite
  path: ./womap_test.db

redis:
  host: localhost
  port: 6379
  db: 0
  username: null
  password: null
  socket_timeout_seconds: 5

auth:
  enabled: true
  local_user:
    username: local-admin
    # 首次打开登录页时由本机用户设置；真实哈希只写入忽略提交的 settings.local.yaml。
    password_hash: "replace-with-local-pbkdf2-sha256-hash"
    password_hash_algorithm: pbkdf2_sha256
  password_policy:
    min_length: 15
    max_length: 128
    block_common_passwords: true
  session:
    idle_timeout_minutes: 30
    absolute_timeout_hours: 12
    renewal_timeout_minutes: 30
    remember_me_days: 7
    cookie_name: womap_session
    secure_cookie: true
    http_only_cookie: true
    same_site: lax
  throttling:
    lockout_attempts: 5
    lockout_window_minutes: 15
  dynamic_update:
    policy_refresh_seconds: 30
    warn_before_expire_minutes: 5
    rotate_after_login: true
  audit:
    log_login_events: true
    redact_session_id: true

maps:
  providers:
    - id: tianditu-vector
      type: xyz
      name: 天地图矢量
      url_template: https://t{s}.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk={api_key}
      api_key: ""
      subdomains: ["0", "1", "2", "3", "4", "5", "6", "7"]
      enabled: false
    - id: amap-vector
      type: xyz
      name: 高德矢量
      url_template: https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}
      api_key: ""
      subdomains: ["1", "2", "3", "4"]
      enabled: true
    - id: tencent-vector
      type: xyz
      name: 腾讯矢量
      url_template: https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={y}&type=vector&styleid=1
      api_key: ""
      subdomains: ["0", "1", "2", "3"]
      enabled: true
    - id: baidu-vector
      type: xyz
      name: 百度矢量
      url_template: https://online{s}.map.bdimg.com/tile/?qt=tile&x={x}&y={y}&z={z}&styles=pl
      api_key: ""
      subdomains: ["0", "1", "2", "3"]
      enabled: false
    - id: custom-xyz
      type: xyz
      name: 自定义 XYZ
      url_template: ""
      api_key: ""
      subdomains: []
      enabled: false

performance:
  # auto 会按逻辑 CPU 与可用内存选择保守档位；预算直接约束 WOMAP 进程，不改变系统全局设置。
  profile: auto
  max_features_per_request: 5000
  default_bbox_limit: 1000
  simplify_tolerance: 0.00001
  cache_ttl_seconds: 120
  large_layer_feature_threshold: 50000
  tile_feature_threshold: 10000
  api:
    worker_count: 1
    database_pool_size: null
    database_max_overflow: null
    database_timeout_seconds: 30
    database_recycle_seconds: 1800
  worker:
    enabled: false
    concurrency: null
    poll_interval_seconds: 1.0
    lease_seconds: 120
    heartbeat_seconds: 30
    shutdown_grace_seconds: 30
    database_pool_size: 2
    database_timeout_seconds: 30
    database_recycle_seconds: 1800
    windows_priority: below_normal
    linux_nice: 10
  gdal:
    cache_mib: null
    thread_cap: null
    dataset_pool_size: null
    formula_window_budget_mib: null
    scratch_reserve_gib: 5
  browser:
    vector_limit: null
    bbox_debounce_ms: null
    webgl_texture_cache: null
    geotiff_cache_size: null
    # 只有回放基准证明 source-update p95 至少改善 20% 后才开启。
    incremental_source_updates: false
    # 浏览模式按半像素简化，并受此 EPSG:3857 米值上限约束；编辑/分析始终禁用简化。
    browse_simplify_max_tolerance: 5.0
  cache:
    enabled: false
    namespace: womap:performance
    ttl_seconds: 120
    max_entry_kib: 256
    fail_open: true
  gpu:
    # CPU 是权威路径；auto/cupy 仅在 `uv sync --extra gpu` 且本机正确性与 >=1.5x 端到端门槛通过后执行。
    # 门槛缺失、损坏、硬件/运行时指纹变化或 Worker 内 GPU 失败都会 fail-closed 到 CPU。
    backend: cpu
    device_index: 0
    memory_fraction: 0.5
    minimum_speedup: 1.5
